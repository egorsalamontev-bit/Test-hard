<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= title %> — Мой сайт</title>
    <meta name="description" content="<%= metaDescription || 'Многостраничный сайт на Node.js' %>" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

    <!-- Шапка с навигацией -->
    <header>
        <nav>
            <a href="/" class="<%= activePage === 'home' ? 'active' : '' %>">🏠 Главная</a>
            <a href="/about" class="<%= activePage === 'about' ? 'active' : '' %>">📄 О нас</a>
            <a href="/services" class="<%= activePage === 'services' ? 'active' : '' %>">⚡ Услуги</a>
            <a href="/contact" class="<%= activePage === 'contact' ? 'active' : '' %>">📞 Контакты</a>
        </nav>
    </header>

    <!-- Основной контент -->
    <main id="app">
        <%- body %>
    </main>

    <!-- Подвал -->
    <footer>
        &copy; 2026 Мой сайт. Все права защищены.
    </footer>

    <script src="/js/main.js"></script>
</body>
</html>
